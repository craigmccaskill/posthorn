name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'spec/**'
      - '*.md'
      - '.github/workflows/site-deploy.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'spec/**'
      - '*.md'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: core/go.mod

      - name: Verify modules
        run: go mod verify

      - name: gofmt gate
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout=2m ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: core/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: core
